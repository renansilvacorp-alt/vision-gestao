name: Vision CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/vision_gestao
      NEON_AUTH_BASE_URL: https://example.invalid/neondb/auth
      NEON_AUTH_COOKIE_SECRET: ci-only-placeholder-secret-with-more-than-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
